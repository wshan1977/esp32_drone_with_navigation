; XW-Drone 펌웨어 (Flix 기반) — PlatformIO 빌드
; arduino-esp32 core 3.3.x 필요 → pioarduino 플랫폼 사용
; 빌드: pio run -e esp32dev   업로드: pio run -e esp32dev -t upload   모니터: pio device monitor

[platformio]
default_envs = esp32dev

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.31/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
lib_deps =
	okalachev/MAVLink@^2.0.30
	okalachev/FlixPeriph@^1.10.4
	pololu/VL53L1X@^1.3.1

; 기본 보드: ESP32-DEVKITV1 (XW_Z1_V2.0 PCB)
[env:esp32dev]
board = esp32dev

[env:esp32s3]
board = esp32-s3-devkitc-1

[env:esp32c3]
board = esp32-c3-devkitm-1
